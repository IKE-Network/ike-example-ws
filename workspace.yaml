# workspace.yaml — IKE Workspace Example Manifest
# ══════════════════════════════════════════════════
#
# Consumer-side integration workspace. Orchestrates the example
# downstream projects — doc-example, project-example,
# integration-tests-example — that consume the released foundation
# artifacts (ike-tooling, ike-docs, ike-platform) from Nexus.
#
# Foundation repos (ike-tooling, ike-docs, ike-platform) are
# intentionally NOT workspace subprojects — see the discussion below
# under each excluded entry. They live as siblings of any workspace
# at ~/ike-dev/<repo>/ and release independently via their own
# ike:release-publish goal.
#
# Naming policy (IKE-Network/ike-issues#467): for every subproject
# the artifact ID, the git repo name, the on-disk directory, and the
# workspace.yaml subproject key must all match — exactly. No
# transformations, no aliases. Example templates use the
# `<role>-example` pattern. This workspace was previously named
# `ike-example-ws` with subprojects `example-project` and `its`;
# all three were renamed under that policy on 2026-05-20.

schema-version: "1.0"
generated: 2026-05-20

defaults:
  branch: main
  maven-version: "4.0.0-rc-5"

subprojects:

  # ── Excluded foundation repos ────────────────────────────────────
  #
  # ike-tooling is the bootstrap project — the source of
  # ike-maven-plugin, which every other repo uses at build time.
  # Its own release relies on ike:release-publish from the plugin
  # it produces (self-bootstrap), so an external workspace cannot
  # orchestrate it without first installing that SNAPSHOT locally.
  #
  # ike-platform contains ike-workspace-maven-plugin — the very
  # plugin that defines the ws:* goals — plus ike-parent (the
  # release-tracked parent POM that consumers inherit). Putting
  # ike-platform inside a workspace creates a self-reference and
  # triggers a Maven 4 reactor parent-cycle bug:
  #   ike-parent:N → workspace pom.xml → ike-parent:N
  # because Maven's project loader can't disambiguate between the
  # released ike-parent (Nexus) and the local reactor module of
  # the same artifactId.
  #
  # ike-docs provides ike-doc-maven-plugin (a regular managed plugin
  # post-#321 — earlier revisions used extensions=true to register a
  # custom <packaging>ike-doc</packaging> type at literal versions,
  # retired in favor of a classifier-canonical doc shape).
  # Same architectural argument applies: it's foundation-y, lives
  # above the consumer line in the cascade, and its release happens
  # through its own ike:release-publish from its own repo.
  #
  # All three live at ~/ike-dev/<repo>/ as siblings of this workspace.
  # Downstream picks up new releases via property bumps:
  # ike-tooling.version, ike-docs.version, and the literal ike-parent
  # version in each consumer's <parent> block.
  #
  # ────────────────────────────────────────────────────────────────

  doc-example:
    description: >
      Standalone doc-only project using ike-doc packaging. Inherits
      network.ike.platform:ike-parent directly from Nexus.
    repo: https://github.com/IKE-Network/doc-example.git
    branch: main
    version: "35"
    state: tag-aligned
    kind: release
    tag: v35
    groupId: network.ike.examples
    # ── managed: depends-on is derived from POMs by ws goals; build edges are machine-owned, other relationships are preserved (ike-issues#964) ──
    depends-on: []

  project-example:
    description: >
      Standalone Java + docs project demonstrating a single-command
      build that compiles sources, runs tests, and renders AsciiDoc.
    repo: https://github.com/IKE-Network/project-example.git
    branch: main
    version: 35-SNAPSHOT
    groupId: network.ike.examples
    # ── managed: depends-on is derived from POMs by ws goals; build edges are machine-owned, other relationships are preserved (ike-issues#964) ──
    depends-on:
      - subproject: doc-example
        relationship: build
        version-property: doc-example.version

  integration-tests-example:
    description: >
      Optional integration-test harness — end-to-end smoke tests
      that exercise the IKE Network release cascade as an external
      consumer. Split out of this workspace in #343 so the IT
      harness can evolve on its own cadence and a broken IT POM
      never blocks a workspace release.
    repo: https://github.com/IKE-Network/integration-tests-example.git
    branch: main
    version: 27-SNAPSHOT
    groupId: network.ike.examples
    # ── managed: depends-on is derived from POMs by ws goals; build edges are machine-owned, other relationships are preserved (ike-issues#964) ──
    depends-on: []
